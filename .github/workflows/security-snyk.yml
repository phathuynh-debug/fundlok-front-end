name: Security (Snyk)

# SCA  -> Snyk Open Source: scans package-lock.json for vulnerable dependencies.
# SAST -> Snyk Code:        static analysis of our own source in app/, lib/, etc.
#
# Requires the repository secret SNYK_TOKEN (Snyk service account / API token).
# Optional repository variable SNYK_ORG to target a specific Snyk organization.
# Snyk Code must be enabled for that org (Snyk UI > Settings > Snyk Code).

on:
  pull_request:
  push:
    branches:
      - production
      - preview
  schedule:
    # Weekly re-scan so newly disclosed CVEs surface without a code change.
    - cron: "0 2 * * 1"

permissions:
  contents: read
  # Needed to publish SARIF to the GitHub Security tab (requires GitHub
  # Advanced Security on private repos - upload is best-effort, see below).
  security-events: write
  actions: read

env:
  SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
  SNYK_CFG_ORG: ${{ vars.SNYK_ORG }}

jobs:
  snyk-sca:
    name: SCA (dependencies)
    runs-on: ubuntu-latest
    # Forked PRs have no access to SNYK_TOKEN, so the scan would only fail noisily.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Snyk CLI
        run: npm install -g snyk

      # snyk test exits non-zero when issues are found; keep going so the SARIF
      # still gets uploaded, then fail the job explicitly at the end.
      # Only production dependencies are scanned (Snyk's npm default); add --dev
      # to include devDependencies. To soften the gate while paying down the
      # existing backlog, add --fail-on=upgradable so only fixable issues break
      # the build.
      - name: Snyk Open Source test
        id: sca
        continue-on-error: true
        run: |
          snyk test \
            --file=package-lock.json \
            --package-manager=npm \
            --severity-threshold=high \
            --sarif-file-output=snyk-sca.sarif

      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-sca-sarif
          path: snyk-sca.sarif
          if-no-files-found: warn

      - name: Publish to GitHub code scanning
        if: always()
        continue-on-error: true # no-op without GitHub Advanced Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-sca.sarif
          category: snyk-sca

      - name: Fail on high/critical dependency vulnerabilities
        if: steps.sca.outcome == 'failure'
        run: |
          echo "Snyk Open Source found high or critical vulnerabilities."
          echo "Run 'bun run security:sca' locally for details."
          exit 1

  snyk-code:
    name: SAST (source code)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Snyk CLI
        run: npm install -g snyk

      # No dependency install needed: Snyk Code analyses source files directly.
      - name: Snyk Code test
        id: sast
        continue-on-error: true
        run: |
          snyk code test \
            --severity-threshold=high \
            --sarif-file-output=snyk-code.sarif

      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-code-sarif
          path: snyk-code.sarif
          if-no-files-found: warn

      - name: Publish to GitHub code scanning
        if: always()
        continue-on-error: true # no-op without GitHub Advanced Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-code.sarif
          category: snyk-code

      - name: Fail on high/critical code issues
        if: steps.sast.outcome == 'failure'
        run: |
          echo "Snyk Code found high or critical issues."
          echo "Run 'bun run security:sast' locally for details."
          exit 1

  snyk-monitor:
    name: Monitor (snapshot production dependencies)
    runs-on: ubuntu-latest
    needs: snyk-sca
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Snyk CLI
        run: npm install -g snyk

      # Sends the dependency snapshot to Snyk so newly disclosed CVEs against
      # what is actually deployed trigger alerts between CI runs.
      - name: Snyk monitor
        run: |
          snyk monitor \
            --file=package-lock.json \
            --package-manager=npm \
            --project-name=fundlok-frontend
