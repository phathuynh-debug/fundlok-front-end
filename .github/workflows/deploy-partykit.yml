name: Deploy PartyKit

# Deploys party/ (the live-notification relay) to OUR OWN Cloudflare account
# (PartyKit "cloud-prem"), not the hosted partykit.dev platform.
#
# Runs only when something under party/ changes on `production`, or by hand.
# It is independent of the Vercel deploy: the frontend only needs the host, and
# the relay does not depend on the frontend build.
#
# Repository secrets (Settings -> Secrets and variables -> Actions -> Secrets):
#   CLOUDFLARE_ACCOUNT_ID     the account that will run the worker
#   CLOUDFLARE_API_TOKEN      created from the "Edit Cloudflare Workers" template
#   PARTYKIT_JWT_SECRET       must equal the backend's PARTYKIT_JWT_SECRET
#   PARTYKIT_PUBLISH_SECRET   must equal the backend's PARTYKIT_PUBLISH_SECRET
# Repository variable (same page -> Variables):
#   PARTYKIT_DOMAIN           hostname the relay is served on, e.g. realtime.fundlok.com.
#                             It must be a domain in that Cloudflare account. This
#                             value is also the backend's PARTYKIT_HOST and the
#                             frontend's NEXT_PUBLIC_PARTYKIT_HOST.

on:
  push:
    branches:
      - production
    paths:
      - "party/**"
      - ".github/workflows/deploy-partykit.yml"
  workflow_dispatch:

# Two deploys of the same project at once would race; the newer one wins.
concurrency:
  group: deploy-partykit
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: party
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PARTYKIT_JWT_SECRET: ${{ secrets.PARTYKIT_JWT_SECRET }}
      PARTYKIT_PUBLISH_SECRET: ${{ secrets.PARTYKIT_PUBLISH_SECRET }}
      PARTYKIT_DOMAIN: ${{ vars.PARTYKIT_DOMAIN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: party/package-lock.json

      - name: Check required secrets and variables
        run: |
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN PARTYKIT_JWT_SECRET PARTYKIT_PUBLISH_SECRET PARTYKIT_DOMAIN; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set (repository secret/variable)"
              missing=1
            fi
          done
          [ -z "${missing:-}" ]

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # The two secrets are passed as deploy variables so the repo's secrets
      # stay the single source of truth; the server reads them from env.
      - name: Deploy
        run: >
          npx partykit deploy
          --domain "$PARTYKIT_DOMAIN"
          --var "PARTYKIT_JWT_SECRET=$PARTYKIT_JWT_SECRET"
          "PARTYKIT_PUBLISH_SECRET=$PARTYKIT_PUBLISH_SECRET"

      - name: Summary
        run: |
          {
            echo "### PartyKit deployed"
            echo ""
            echo "Host (no scheme): \`$PARTYKIT_DOMAIN\`"
            echo ""
            echo "Set this as the backend's \`PARTYKIT_HOST\` and Vercel's \`NEXT_PUBLIC_PARTYKIT_HOST\`."
          } >> "$GITHUB_STEP_SUMMARY"
