# Frontend CI/CD — single pipeline for tests AND deploys
#
#   PR to preview / production  -> i18n + lint + style + build + unit-tests + e2e + dependency audit
#   push to preview / production -> all CI checks -> enforce Vercel deploy author
#   Vercel trigger commit         -> checks skipped; Vercel deploys it on its own
#
# Deploy trigger job is gated with `needs: [i18n-check, lint-styling, lint, build, unit-tests, e2e, dependency-audit]`
# — deployment only triggers when all other CI pipelines pass.

name: Frontend CI/CD

on:
  pull_request:
  push:
    branches:
      - production
      - preview

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The "chore: ensure Vercel deployment author" commit made by enforce-author
  # changes only .vercel-trigger, which holds the SHA it was cut from: a commit
  # that just passed every check below. Testing it again would test the same
  # code twice, so the checks are skipped and Vercel deploys it. Matched on
  # content, not the commit message, so a hand-written commit with that message
  # still gets the full suite, as does a trigger rebased onto a newer tip
  # (someone pushed in between).
  deploy-only:
    name: Detect Deploy-Only Commit
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for a Vercel trigger commit
        id: check
        run: |
          PARENT=$(git rev-parse --verify --quiet HEAD^1 || true)
          CHANGED=$(git diff --name-only HEAD^1 HEAD 2>/dev/null || true)
          PINNED=$(cat .vercel-trigger 2>/dev/null || true)

          if [ -n "$PARENT" ] && [ "$CHANGED" = ".vercel-trigger" ] && [ "$PINNED" = "$PARENT" ]; then
            echo "::notice::Vercel trigger commit on top of $PARENT, which already ran CI. Skipping checks."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  i18n-check:
    name: i18n Check
    runs-on: ubuntu-latest
    needs: deploy-only
    if: needs.deploy-only.outputs.skip != 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        # Third-party action: pinned to a commit, not a movable tag (v2.2.0).
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check i18n sorting
        run: bun run i18n:check

  lint-styling:
    name: Lint Styling Check
    runs-on: ubuntu-latest
    needs: deploy-only
    if: needs.deploy-only.outputs.skip != 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        # Third-party action: pinned to a commit, not a movable tag (v2.2.0).
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check code styling (Prettier)
        run: bun run lint:style

  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    needs: deploy-only
    if: needs.deploy-only.outputs.skip != 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        # Third-party action: pinned to a commit, not a movable tag (v2.2.0).
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: deploy-only
    if: needs.deploy-only.outputs.skip != 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        # Third-party action: pinned to a commit, not a movable tag (v2.2.0).
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: deploy-only
    if: needs.deploy-only.outputs.skip != 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        # Third-party action: pinned to a commit, not a movable tag (v2.2.0).
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Vitest
        run: bun run test

  # Known vulnerabilities in bun.lock (compliance audit SEC-07), from the
  # npm advisory database that `npm audit` uses.
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    needs: deploy-only
    if: needs.deploy-only.outputs.skip != 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        # Third-party action: pinned to a commit, not a movable tag (v2.2.0).
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.11"

      # What ships to users: no known advisory of moderate severity or above.
      - name: Audit production dependencies
        run: bun audit --prod --audit-level=moderate

      # Everything, build and dev tooling included: high and above. One
      # suppression, with the same bar as the backend's pip-audit:
      #   GHSA-vfj7-8cjw-p6xm  braces <=3.0.3, stack exhaustion on deeply
      #   nested glob patterns. No fixed release exists (3.0.3 is the
      #   latest). It reaches only dev tooling (shadcn CLI and
      #   eslint-config-next, via fast-glob > micromatch), which globs
      #   patterns we write ourselves; nothing shipped depends on it.
      #   Drop the --ignore once braces publishes a fix.
      - name: Audit all dependencies
        run: bun audit --audit-level=high --ignore=GHSA-vfj7-8cjw-p6xm

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: deploy-only
    if: needs.deploy-only.outputs.skip != 'true'
    # A browser download plus a production build; well clear of the default 6h
    # but tight enough that a hung server fails instead of idling.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        # Third-party action: pinned to a commit, not a movable tag (v2.2.0).
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.11"

      # Playwright's runner is a Node program. Bun installs the deps and runs
      # the app and the stub API; Node runs the test runner, which is the only
      # combination either tool supports.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Keyed on the resolved Playwright version so a bump re-downloads instead
      # of restoring a browser the runner can no longer drive.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # System deps live outside the cached browser directory, so they are
      # installed even on a cache hit.
      - name: Install browser system dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Built here rather than inside playwright.config.ts so a build failure
      # is reported as a build failure, not as a webServer timeout.
      - name: Build app for E2E
        env:
          API_URL: http://127.0.0.1:8100
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
          # The app's own Turnstile escape hatch. Safe here and only here: this
          # build is a throwaway artifact that is never deployed.
          NEXT_PUBLIC_DISABLE_TURNSTILE: "true"
          NEXT_DIST_DIR: .next-e2e
        run: bun run build

      - name: Run Playwright tests
        env:
          # Skip the rebuild in the webServer command — the step above did it.
          E2E_SKIP_BUILD: "1"
          NEXT_DIST_DIR: .next-e2e
        run: npx playwright test

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  enforce-author:
    name: Enforce Vercel Deploy Author
    timeout-minutes: 20
    runs-on: ubuntu-latest
    needs:
      [i18n-check, lint-styling, lint, build, unit-tests, e2e, dependency-audit]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/production' || github.ref == 'refs/heads/preview')
    permissions:
      contents: write
      pull-requests: write
    env:
      EXPECTED_EMAIL: ${{ secrets.VERCEL_AUTHOR_EMAIL || 'your-vercel-owner-email@example.com' }}
      EXPECTED_NAME: ${{ secrets.VERCEL_AUTHOR_NAME || 'Vercel Owner Name' }}
      BASE_BRANCH: ${{ github.ref_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.VERCEL_AUTHOR_PAT || secrets.GITHUB_TOKEN }}

      - name: Check latest commit author
        id: check-author
        run: |
          echo "Expected author email: $EXPECTED_EMAIL"

          # Get the email of the author of the latest commit
          LATEST_AUTHOR_EMAIL=$(git log -1 --pretty=format:'%ae')
          echo "Latest commit author email: $LATEST_AUTHOR_EMAIL"

          if [ "$LATEST_AUTHOR_EMAIL" != "$EXPECTED_EMAIL" ]; then
            echo "Author mismatch detected."
            echo "mismatch=true" >> "$GITHUB_OUTPUT"
          else
            echo "mismatch=false" >> "$GITHUB_OUTPUT"
            echo "Author matches. All good!"
          fi

      - name: Create trigger commit and PR
        if: steps.check-author.outputs.mismatch == 'true'
        env:
          GH_TOKEN: ${{ secrets.VERCEL_AUTHOR_PAT || secrets.GITHUB_TOKEN }}
        run: |
          # 1. Configure git with the target author's identity
          git config --global user.email "$EXPECTED_EMAIL"
          git config --global user.name "$EXPECTED_NAME"

          BRANCH_NAME="chore/trigger-vercel-deploy-${BASE_BRANCH}"

          # 2. Check if the PR already exists
          EXISTING_PR=$(gh pr list --head "$BRANCH_NAME" --base "$BASE_BRANCH" --json number --jq '.[0].number')

          # 3. Create or reset the trigger branch off the current tip of BASE_BRANCH
          git checkout -B "$BRANCH_NAME"
          # The SHA that just passed CI; the deploy-only job matches on it.
          echo "$GITHUB_SHA" > .vercel-trigger
          git add .vercel-trigger
          git commit -m "chore: ensure Vercel deployment author"

          # 4. Push the branch (force push to ensure it matches current tip + trigger commit)
          git push origin "$BRANCH_NAME" --force

          if [ -z "$EXISTING_PR" ]; then
            # 5. Create the pull request
            gh pr create \
              --title "chore: trigger Vercel deployment" \
              --body "Automated PR to ensure the latest commit on \`$BASE_BRANCH\` has the correct author (${EXPECTED_EMAIL}) so Vercel can deploy it. Rebased automatically — only the trigger commit (with the correct author) lands on \`$BASE_BRANCH\`." \
              --base "$BASE_BRANCH" \
              --head "$BRANCH_NAME"

            echo "Pull Request created successfully."
          else
            echo "A Pull Request for $BRANCH_NAME already exists (PR #$EXISTING_PR). Branch updated to latest tip."
          fi

          # 6. Rebase-merge the trigger PR so ONLY the trigger commit (already
          #    authored with $EXPECTED_EMAIL) lands on the base branch. A
          #    regular merge commit would be authored by whoever merged,
          #    re-triggering this job in a loop. This job only runs after all
          #    CI checks passed (needs: [...]), and branch protection is off,
          #    so the rebase merge is immediate and deterministic.
          gh pr merge "$BRANCH_NAME" --rebase --delete-branch

          echo "::notice::Trigger PR rebased and merged — the follow-up push re-runs CI and passes the author check."
          exit 0

      - name: Cleanup outdated PR and branch
        if: steps.check-author.outputs.mismatch == 'false'
        env:
          GH_TOKEN: ${{ secrets.VERCEL_AUTHOR_PAT || secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="chore/trigger-vercel-deploy-${BASE_BRANCH}"

          # 1. Find and close any open PR for this branch
          EXISTING_PR=$(gh pr list --head "$BRANCH_NAME" --base "$BASE_BRANCH" --json number --jq '.[0].number')

          if [ -n "$EXISTING_PR" ]; then
            echo "Closing outdated PR #$EXISTING_PR because author now matches."
            gh pr close "$EXISTING_PR" --comment "✅ Closing this PR as the latest commit on $BASE_BRANCH now has the correct author."
          fi

          # 2. Delete the remote branch if it exists
          if git ls-remote --exit-code --heads origin "$BRANCH_NAME"; then
            echo "Deleting remote branch $BRANCH_NAME"
            git push origin --delete "$BRANCH_NAME"
          fi
